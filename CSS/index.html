<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="Author" content="Julien Mastaki" />
    <title>Cours CSS</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
        <!-- un titre avec un id -->
      <h1 id="titre">Exercices CSS</h1>
    </header>

    <div>
      <main>
        <h2>Deuxs paragraphe</h2>
        <!-- deux paragraphe avec une class -->
        <p class="paragraphe">Premier paragraphe</p>
        <p class="paragraphe">Deuxieme paragraphe</p>
        <h2>Une liste avec plusieurs éléments :</h2>
        <ul>
            <!-- plusieurs éléments d'une liste -->
            <li>Element 1</li>
            <li>Element 2</li>
            <li>Element 3</li>
            <li>Element 4</li>
        </ul>
        <h2>Des champs de formulaire :</h2>
        <!-- plusieurs champs d'un formulaire -->
        <input type="text" placeholder="input avec texte">
        <input type="number" placeholder="input avec number">
        <input type="email" placeholder="input avec email">
        <input type="tel" placeholder="input avec tel">
      </main>
    </div>
  </body>
</html>
